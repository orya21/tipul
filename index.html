<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עמדת רישום שירותים</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            color: #2c3e50;
            margin: 0;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* חוסם גלילה לחלוטין */
        }

        .container {
            width: 100%;
            max-width: 100%; /* מנצל את כל רוחב האייפד */
            height: 98vh; /* מנצל את מקסימום גובה המסך */
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.2rem; /* הגדלת כותרת הסעיף */
            margin: 0 0 4px 0;
            border-right: 5px solid #ff6b6b;
            padding-right: 8px;
            text-align: right;
            color: #2f3542;
        }
        
        #patient-title { border-right-color: #10ac84; }

        /* שורת המטפלים - כפתורים גדולים וברורים יותר */
        .caregivers-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .circle-btn {
            width: 76px; /* הגדלת עיגול המטפל */
            height: 76px;
            border-radius: 50%;
            border: 3px solid #fff;
            font-size: 1.25rem; /* טקסט מטפלים גדול בהרבה */
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
        }

        /* צבעים למטפלים */
        .circle-btn[data-name="אלכס"] { background: linear-gradient(135deg, #3498db, #2980b9); }
        .circle-btn[data-name="ג'רי"] { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .circle-btn[data-name="ליאור"] { background: linear-gradient(135deg, #e67e22, #d35400); }
        .circle-btn[data-name="עמונה"] { background: linear-gradient(135deg, #ff6b81, #ff4757); }
        .circle-btn[data-name="אמאני"] { background: linear-gradient(135deg, #10ac84, #0b8462); }
        .circle-btn[data-name="האנדי"] { background: linear-gradient(135deg, #11144c, #2d3294); }
        .circle-btn[data-name="אחר"] { background: linear-gradient(135deg, #747d8c, #2f3542); }

        .circle-btn.selected {
            transform: scale(1.05);
            border-color: #2ed573;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.4);
        }

        /* גריד המטופלים - תופס את כל רוחב המסך ומגדיל את הכתב */
        .patients-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 4px;
            padding: 4px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e4e7eb;
            flex-grow: 1;
        }

        .patient-btn {
            background: #ffffff;
            border: 1px solid #ced6e0;
            padding: 8px 2px; /* אופטימיזציה לגובה */
            font-size: 1.15rem; /* הגדלה משמעותית של שמות המטופלים! */
            font-weight: bold; /* הפיכת הגופן למודגש וקריא */
            border-radius: 8px;
            cursor: pointer;
            color: #2f3542;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            user-select: none;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .patient-btn.selected {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
            border-color: #2e7d32 !important;
            color: #1b5e20 !important;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.2);
        }

        /* כפתורי פעולה ותיבת סטטוס */
        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.6rem; /* הגדלת טקסט כ
