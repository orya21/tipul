<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עמדת רישום שירותים</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            color: #2c3e50;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* חוסם גלילה לחלוטין */
        }

        .container {
            width: 100%;
            max-width: 1280px;
            height: 98vh; /* מנצל את מקסימום גובה המסך */
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1rem;
            margin: 0 0 5px 0;
            border-right: 4px solid #ff6b6b;
            padding-right: 6px;
            text-align: right;
            color: #2f3542;
        }
        
        #patient-title { border-right-color: #10ac84; }

        /* שורת המטפלים - צפופה וחסכונית */
        .caregivers-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .circle-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid #fff;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            user-select: none;
        }

        /* צבעים למטפלים */
        .circle-btn[data-name="אלכס"] { background: linear-gradient(135deg, #3498db, #2980b9); }
        .circle-btn[data-name="ג'רי"] { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .circle-btn[data-name="ליאור"] { background: linear-gradient(135deg, #e67e22, #d35400); }
        .circle-btn[data-name="עמונה"] { background: linear-gradient(135deg, #ff6b81, #ff4757); }
        .circle-btn[data-name="אמאני"] { background: linear-gradient(135deg, #10ac84, #0b8462); }
        .circle-btn[data-name="האנדי"] { background: linear-gradient(135deg, #11144c, #2d3294); }
        .circle-btn[data-name="אחר"] { background: linear-gradient(135deg, #747d8c, #2f3542); }

        .circle-btn.selected {
            transform: scale(1.05);
            border-color: #2ed573;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.4);
        }

        /* גריד המטופלים - צומצם לגובה מינימלי */
        .patients-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-bottom: 5px;
            padding: 4px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e4e7eb;
            flex-grow: 1; /* דוחף את הגריד לנצל את כל האמצע */
        }

        .patient-btn {
            background: #ffffff;
            border: 1px solid #ced6e0;
            padding: 6px 2px; /* הכי קומפקטי שיש בגובה */
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: #2f3542;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            user-select: none;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .patient-btn.selected {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
            border-color: #2e7d32 !important;
            color: #1b5e20 !important;
            box-shadow: 0 2px 6px rgba(46, 125, 50, 0.2);
        }

        /* כפתורי פעולה ותיבת סטטוס */
        .action-btn {
            width: 100%;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        #btn-start { 
            background-color: #a4b0be; 
            cursor: not-allowed; 
            display: block;
        }
        
        #btn-start.ready { 
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }
        
        #btn-end { 
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            display: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.2);
        }

        #status-box {
            margin-top: 5px;
            padding: 6px;
            border-radius: 8px;
            background-color: #f1f2f6;
            font-size: 0.95rem;
            font-weight: bold;
            color: #57606f;
            border: 2px dashed #ced6e0;
        }

        .running-mode {
            background: linear-gradient(135deg, #fff9db, #fff3cd) !important;
            color: #856404 !important;
            border: 2px solid #ffeeba !important;
        }
    </style>
</head>
<body>

<div class="container">

        <h2>מטפל/ת:</h2>

            <button class="patient-btn" data-name="אולגה סורוקין">אולגה סורוקין</button>
            <button class="patient-btn" data-name="נחמיאס ליאת">נחמיאס לי
