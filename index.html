<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עמדת רישום שירותים</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            color: #2c3e50;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* מונע גלילה לחלוטין */
        }

        .container {
            width: 100%;
            max-width: 1280px;
            height: 96vh; /* ניצול גובה המסך */
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.1rem;
            margin: 0 0 8px 0;
            border-right: 4px solid #ff6b6b;
            padding-right: 8px;
            text-align: right;
            color: #2f3542;
        }
        
        #patient-title { border-right-color: #10ac84; }

        /* שורת המטפלים העליונה - גודל מקורי קומפקטי */
        .caregivers-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .circle-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #fff;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            user-select: none;
        }

        /* צבעים למטפלים */
        .circle-btn[data-name="אלכס"] { background: linear-gradient(135deg, #3498db, #2980b9); }
        .circle-btn[data-name="ג'רי"] { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .circle-btn[data-name="ליאור"] { background: linear-gradient(135deg, #e67e22, #d35400); }
        .circle-btn[data-name="עמונה"] { background: linear-gradient(135deg, #ff6b81, #ff4757); }
        .circle-btn[data-name="אמאני"] { background: linear-gradient(135deg, #10ac84, #0b8462); }
        .circle-btn[data-name="האנדי"] { background: linear-gradient(135deg, #11144c, #2d3294); }
        .circle-btn[data-name="אחר"] { background: linear-gradient(135deg, #747d8c, #2f3542); }

        .circle-btn.selected {
            transform: scale(1.05);
            border-color: #2ed573;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }
