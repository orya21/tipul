<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עמדת רישום טיפול</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            color: #2c3e50;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1250px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            font-size: 1.4rem;
            margin: 0 0 15px 0;
            border-right: 6px solid #ff6b6b;
            padding-right: 12px;
            text-align: right;
            color: #2f3542;
        }
        
        #patient-title { border-right-color: #10ac84; }

        .caregivers-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .circle-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #fff;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            user-select: none;
        }

        .circle-btn[data-name="אלכס"] { background: linear-gradient(135deg, #3498db, #2980b9); }
        .circle-btn[data-name="ג'רי"] { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .circle-btn[data-name="ליאור"] { background: linear-gradient(135deg, #e67e22, #d35400); }
        .circle-btn[data-name="עמונה"] { background: linear-gradient(135deg, #ff6b81, #ff4757); }
        .circle-btn[data-name="אמאני"] { background: linear-gradient(135deg, #10ac84, #0b8462); }
        .circle-btn[data-name="האנדי"] { background: linear-gradient(135deg, #11144c, #2d3294); }
        .circle-btn[data-name="אחר"] { background: linear-gradient(135deg, #747d8c, #2f3542); }

        .circle-btn.selected { transform: scale(1.1); border-color: #2ed573; box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4); }

        .patients-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            height: 380px; 
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 1px solid #e4e7eb;
        }

        .patient-btn {
            background: #ffffff;
            border: 1px solid #ced6e0;
            padding: 15px 10px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            color: #2f3542;
            transition: all 0.15s ease;
            text-align: center;
        }

        .patient-btn.selected {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9) !important;
            border-color: #2e7d32 !important;
            color: #1b5e20 !important;
        }

        .action-container { position: relative; z-index: 100; }

        .action-btn {
            width: 100%;
            padding: 22px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        #btn-start { background-color: #a4b0be; cursor: not-allowed; }
        #btn-start.ready { background: linear-gradient(135deg, #2ecc71, #27ae60); cursor: pointer; }
        #btn-end { background: linear-gradient(135deg, #ff4757, #ff6b81); display: none; }

        #status-box {
            padding: 15px;
            border-radius: 12px;
            background-color: #f1f2f6;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px dashed #ced6e0;
        }
    </style>
</head>
<body>
