<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת טיפולים</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 10px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 1rem; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { padding: 8px; border: 1px solid #ccc; border-radius: 5px; background: white; cursor: pointer; }
        .active { background: #4caf50; color: white; border-color: #3e8e41; }
        .action { width: 100%; padding: 15px; margin-top: 15px; background: #2196f3; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>1. בחירת מטפל:</h2>
    <div id="caregivers" class="grid">
        <button onclick="select(this, 'c')">אלכס</button>
        <button onclick="select(this, 'c')">ג'רי</button>
        <button onclick="select(this, 'c')">ליאור</button>
        <button onclick="select(this, 'c')">עמונה</button>
    </div>

    <h2>2. בחירת מטופל:</h2>
    <div id="patients" class="grid">
        <button onclick="select(this, 'p')">רוני</button>
        <button onclick="select(this, 'p')">שאול</button>
        <button onclick="select(this, 'p')">נתנאל</button>
        <button onclick="select(this, 'p')">דניאל</button>
    </div>

    <button class="action" onclick="finish()">סיום טיפול</button>
</div>

<script>
    let data = {c: "", p: ""};
    function select(btn, type) {
        document.querySelectorAll(type == 'c' ? '#caregivers button' : '#patients button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        data[type] = btn.innerText;
    }
    function finish() {
        if(!data.c || !data.p) return alert("חסר מטפל או מטופל!");
        alert("נשמר: " + data.c + " טיפל ב-" + data.p);
        location.reload();
    }
</script>
</body>
</html>
